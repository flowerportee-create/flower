<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Email Client</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-logo">✉︎</span>
        <span>AI Mail</span>
      </div>
      <div class="search">
        <input id="search" type="search" placeholder="メールを検索 (Gmail 検索構文 OK)" />
      </div>
      <div class="account-area">
        <select id="account-switch" title="アカウント切り替え"></select>
        <button id="add-account">＋ アカウント追加</button>
      </div>
    </header>

    <main class="layout">
      <nav class="sidebar">
        <button class="compose" id="compose">＋ 新規作成</button>
        <ul class="labels">
          <li data-label="INBOX" class="active">受信トレイ</li>
          <li data-label="STARRED">スター付き</li>
          <li data-label="SENT">送信済み</li>
          <li data-label="DRAFT">下書き</li>
          <li data-label="TRASH">ゴミ箱</li>
        </ul>
        <div class="learning-card">
          <div class="learning-title">AI 学習状況</div>
          <div id="learning-count">0 件の返信例</div>
          <div class="learning-hint">返信を送るたびに自動で学習例が増えます。</div>
        </div>
      </nav>

      <section class="message-list" id="message-list">
        <div class="empty">読み込み中…</div>
      </section>

      <section class="reading-pane" id="reading-pane">
        <div class="placeholder">メールを選択してください</div>
      </section>
    </main>

    <!-- Compose / Reply modal -->
    <div class="modal-backdrop hidden" id="compose-modal">
      <div class="modal">
        <header class="modal-header">
          <span id="compose-title">返信</span>
          <button id="compose-close" title="閉じる">✕</button>
        </header>
        <div class="modal-body">
          <label>宛先 <input id="compose-to" type="text" /></label>
          <label>Cc <input id="compose-cc" type="text" /></label>
          <label>件名 <input id="compose-subject" type="text" /></label>
          <textarea id="compose-body" rows="14" placeholder="本文…"></textarea>
          <div class="ai-row">
            <input
              id="ai-instruction"
              type="text"
              placeholder="AIへの指示 (任意): 例「もう少しフォーマルに」"
            />
            <button id="ai-draft">🪄 AIで下書き</button>
          </div>
          <div id="ai-status" class="ai-status"></div>
        </div>
        <footer class="modal-footer">
          <button id="compose-send" class="primary">送信</button>
          <button id="compose-cancel">キャンセル</button>
        </footer>
      </div>
    </div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
