<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HANA NO TE — 花屋のための水揚げ辞典</title>
  <meta name="description" content="花屋のための水揚げ方法辞典。花の名前を検索して、最適な水揚げ方法をすぐに調べられます。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Shippori+Mincho:wght@400;500;600&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ivory: #f6f2ea;
      --paper: #fbf8f2;
      --card: #ffffff;
      --line: #e6dfd1;
      --line-soft: #efe9dc;
      --ink: #2b2724;
      --ink-2: #5a5147;
      --muted: #8b8275;
      --sage: #6a7a64;
      --sage-deep: #4d5c4a;
      --leaf: #97a690;
      --rose: #b88a82;
      --gold: #a68a5b;
      --shadow: 0 1px 2px rgba(60, 50, 35, 0.04), 0 8px 24px rgba(60, 50, 35, 0.06);
      --shadow-lg: 0 4px 12px rgba(60, 50, 35, 0.06), 0 24px 48px rgba(60, 50, 35, 0.10);
      --radius: 14px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Noto Sans JP', sans-serif;
      font-weight: 400;
      letter-spacing: 0.02em;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .serif { font-family: 'Shippori Mincho', 'Noto Serif JP', serif; }
    .latin { font-family: 'Cormorant Garamond', serif; letter-spacing: 0.12em; }

    /* ────── HEADER ────── */
    header.site {
      position: sticky; top: 0; z-index: 50;
      background: rgba(251, 248, 242, 0.85);
      backdrop-filter: saturate(140%) blur(12px);
      -webkit-backdrop-filter: saturate(140%) blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .site-inner {
      max-width: 1240px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 32px;
      gap: 24px;
    }
    .brand {
      display: flex; align-items: baseline; gap: 14px;
      text-decoration: none; color: var(--ink);
    }
    .brand-mark {
      width: 30px; height: 30px;
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--sage-deep);
      transform: translateY(4px);
    }
    .brand-jp {
      font-family: 'Shippori Mincho', serif;
      font-size: 22px; font-weight: 500;
      letter-spacing: 0.18em;
    }
    .brand-en {
      font-family: 'Cormorant Garamond', serif;
      font-size: 12px; font-style: italic;
      color: var(--muted);
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    .nav-meta {
      font-size: 12px; color: var(--muted);
      letter-spacing: 0.18em;
      display: flex; align-items: center; gap: 18px;
    }
    .nav-meta .count strong { color: var(--ink-2); font-weight: 500; }
    .nav-meta .divider { width: 1px; height: 14px; background: var(--line); }

    /* ────── HERO ────── */
    .hero {
      max-width: 1240px;
      margin: 0 auto;
      padding: 56px 32px 28px;
      text-align: center;
    }
    .eyebrow {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 14px;
      color: var(--gold);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    .eyebrow::before, .eyebrow::after {
      content: ''; display: inline-block;
      width: 28px; height: 1px; background: var(--gold);
      vertical-align: middle; margin: 0 14px;
      opacity: 0.6;
    }
    h1.title {
      font-family: 'Shippori Mincho', serif;
      font-weight: 500;
      font-size: clamp(32px, 4.6vw, 52px);
      letter-spacing: 0.14em;
      line-height: 1.3;
      color: var(--ink);
    }
    h1.title .accent { color: var(--sage-deep); }
    .lead {
      margin-top: 18px;
      font-size: 14px;
      color: var(--ink-2);
      letter-spacing: 0.08em;
    }

    /* ────── SEARCH ────── */
    .search-wrap {
      max-width: 720px;
      margin: 36px auto 0;
      position: relative;
    }
    .search {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 18px 56px 18px 60px;
      font-size: 16px;
      font-family: inherit;
      color: var(--ink);
      box-shadow: var(--shadow);
      transition: border-color .25s ease, box-shadow .25s ease, transform .25s ease;
    }
    .search::placeholder { color: var(--muted); font-weight: 300; }
    .search:focus {
      outline: none;
      border-color: var(--sage);
      box-shadow: 0 0 0 4px rgba(106, 122, 100, 0.10), var(--shadow-lg);
    }
    .search-icon {
      position: absolute; left: 24px; top: 50%; transform: translateY(-50%);
      color: var(--muted); pointer-events: none;
    }
    .search-clear {
      position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
      width: 28px; height: 28px; border-radius: 50%;
      border: none; background: var(--ivory); color: var(--muted);
      cursor: pointer; display: none;
      align-items: center; justify-content: center;
      transition: background .2s ease, color .2s ease;
    }
    .search-clear:hover { background: var(--line); color: var(--ink); }
    .search-clear.visible { display: inline-flex; }

    /* ────── CATEGORY CHIPS ────── */
    .categories {
      max-width: 1240px;
      margin: 28px auto 0;
      padding: 0 32px;
      display: flex; flex-wrap: wrap; gap: 8px;
      justify-content: center;
    }
    .chip {
      font-family: inherit;
      font-size: 12.5px;
      letter-spacing: 0.12em;
      padding: 8px 18px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink-2);
      cursor: pointer;
      transition: all .2s ease;
    }
    .chip:hover { border-color: var(--sage); color: var(--sage-deep); }
    .chip.active {
      background: var(--sage-deep);
      border-color: var(--sage-deep);
      color: var(--paper);
    }

    /* ────── GRID ────── */
    main { max-width: 1240px; margin: 0 auto; padding: 40px 32px 96px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 24px 24px 22px;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      color: var(--ink);
      transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
      display: flex; flex-direction: column; gap: 14px;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0;
      height: 3px; background: var(--sage-deep);
      transform: scaleX(0); transform-origin: left;
      transition: transform .35s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
      border-color: var(--line-soft);
    }
    .card:hover::before { transform: scaleX(1); }

    .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .card-name {
      font-family: 'Shippori Mincho', serif;
      font-weight: 500;
      font-size: 22px;
      letter-spacing: 0.08em;
      color: var(--ink);
      line-height: 1.35;
    }
    .card-latin {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.10em;
      margin-top: 4px;
    }
    .card-cat {
      font-size: 10.5px;
      letter-spacing: 0.18em;
      color: var(--sage-deep);
      border: 1px solid var(--line);
      padding: 4px 10px;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .card-method {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-top: 2px;
    }
    .tag {
      font-size: 11px;
      letter-spacing: 0.10em;
      padding: 4px 10px;
      border-radius: 4px;
      background: var(--ivory);
      color: var(--ink-2);
    }
    .tag.primary { background: rgba(106, 122, 100, 0.12); color: var(--sage-deep); }
    .card-snippet {
      font-size: 13.5px;
      color: var(--ink-2);
      line-height: 1.7;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-foot {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px dashed var(--line);
      font-size: 11.5px; color: var(--muted); letter-spacing: 0.14em;
    }
    .card-foot .more { color: var(--sage-deep); display: inline-flex; align-items: center; gap: 6px; }

    /* empty */
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 24px;
      color: var(--muted);
    }
    .empty .serif { font-size: 26px; color: var(--ink-2); margin-bottom: 10px; }

    /* ────── MODAL ────── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(43, 39, 36, 0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 100;
      opacity: 0; pointer-events: none;
      transition: opacity .25s ease;
      display: flex; align-items: flex-start; justify-content: center;
      padding: 60px 20px 40px;
      overflow-y: auto;
    }
    .modal-backdrop.open { opacity: 1; pointer-events: auto; }
    .modal {
      background: var(--paper);
      border-radius: 18px;
      max-width: 720px; width: 100%;
      box-shadow: var(--shadow-lg);
      transform: translateY(16px) scale(0.98);
      transition: transform .3s ease;
      overflow: hidden;
      position: relative;
    }
    .modal-backdrop.open .modal { transform: translateY(0) scale(1); }

    .modal-close {
      position: absolute; top: 18px; right: 18px;
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--card); border: 1px solid var(--line);
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
      color: var(--ink-2);
      transition: background .2s ease, color .2s ease, transform .2s ease;
      z-index: 2;
    }
    .modal-close:hover { background: var(--ink); color: var(--paper); transform: rotate(90deg); }

    .modal-hero {
      padding: 56px 48px 28px;
      background:
        radial-gradient(1100px 240px at 80% -40px, rgba(151,166,144,0.22), transparent 60%),
        linear-gradient(180deg, var(--ivory), var(--paper));
      border-bottom: 1px solid var(--line);
    }
    .modal-cat {
      font-size: 11px;
      letter-spacing: 0.28em;
      color: var(--sage-deep);
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .modal-name {
      font-family: 'Shippori Mincho', serif;
      font-weight: 500;
      font-size: 38px;
      letter-spacing: 0.12em;
      color: var(--ink);
    }
    .modal-latin {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 16px;
      color: var(--muted);
      letter-spacing: 0.12em;
      margin-top: 6px;
    }
    .modal-tagline {
      margin-top: 18px;
      font-size: 14px; color: var(--ink-2);
      line-height: 1.85;
      max-width: 56ch;
    }

    .modal-body { padding: 28px 48px 40px; }
    .section + .section { margin-top: 28px; }
    .section-label {
      display: flex; align-items: center; gap: 12px;
      font-size: 12px; letter-spacing: 0.28em;
      color: var(--sage-deep); text-transform: uppercase;
      margin-bottom: 14px;
    }
    .section-label::before {
      content: ''; display: inline-block;
      width: 18px; height: 1px; background: var(--sage-deep);
    }
    .steps { list-style: none; counter-reset: step; }
    .steps li {
      counter-increment: step;
      position: relative;
      padding: 14px 16px 14px 56px;
      border-bottom: 1px solid var(--line-soft);
      font-size: 14.5px; color: var(--ink);
    }
    .steps li:last-child { border-bottom: none; }
    .steps li::before {
      content: counter(step, decimal-leading-zero);
      position: absolute; left: 16px; top: 14px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px; color: var(--gold);
      letter-spacing: 0.06em;
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
    }
    .info-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px 16px;
    }
    .info-card .k { font-size: 11px; letter-spacing: 0.18em; color: var(--muted); }
    .info-card .v {
      font-family: 'Shippori Mincho', serif;
      font-size: 16px; color: var(--ink); margin-top: 4px;
      letter-spacing: 0.06em;
    }
    .note {
      background: rgba(168, 138, 91, 0.07);
      border-left: 3px solid var(--gold);
      padding: 14px 18px;
      font-size: 13.5px;
      color: var(--ink-2);
      border-radius: 0 8px 8px 0;
    }
    .note strong { color: var(--ink); font-weight: 500; }

    /* highlight match */
    mark {
      background: rgba(168, 138, 91, 0.22);
      color: inherit;
      padding: 0 2px;
      border-radius: 2px;
    }

    /* footer */
    footer.site {
      padding: 28px 32px 40px;
      border-top: 1px solid var(--line);
      text-align: center;
      color: var(--muted);
      font-size: 11px; letter-spacing: 0.24em;
    }
    footer.site .serif { font-size: 14px; color: var(--ink-2); letter-spacing: 0.16em; }

    /* responsive */
    @media (max-width: 640px) {
      .site-inner { padding: 14px 20px; }
      .nav-meta { display: none; }
      .hero { padding: 36px 20px 16px; }
      h1.title { font-size: 28px; letter-spacing: 0.10em; }
      .categories { padding: 0 16px; }
      main { padding: 28px 20px 64px; }
      .modal-hero { padding: 48px 24px 22px; }
      .modal-body { padding: 22px 24px 32px; }
      .modal-name { font-size: 28px; }
    }

    /* fade-in stagger */
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .card { animation: rise .35s ease both; }
  </style>
</head>
<body>

  <header class="site">
    <div class="site-inner">
      <a href="#" class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3c1.6 1.8 1.6 4.4 0 6.2-1.6-1.8-1.6-4.4 0-6.2z"/>
            <path d="M5.8 7.2c2.4 0 4.4 2 4.4 4.4-2.4 0-4.4-2-4.4-4.4z"/>
            <path d="M18.2 7.2c-2.4 0-4.4 2-4.4 4.4 2.4 0 4.4-2 4.4-4.4z"/>
            <path d="M8 13.4c1.6 0 2.9 1.3 2.9 2.9-1.6 0-2.9-1.3-2.9-2.9z"/>
            <path d="M16 13.4c-1.6 0-2.9 1.3-2.9 2.9 1.6 0 2.9-1.3 2.9-2.9z"/>
            <path d="M12 11v10"/>
          </svg>
        </span>
        <span>
          <span class="brand-jp">花の手</span>
          <div class="brand-en">HANA NO TE</div>
        </span>
      </a>
      <div class="nav-meta">
        <span class="count"><strong id="totalCount">0</strong> FLOWERS</span>
        <span class="divider"></span>
        <span>水揚げ辞典</span>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="eyebrow">For Florists</div>
    <h1 class="title">花の名を引き、<span class="accent">いのちを保つ。</span></h1>
    <p class="lead serif">花屋のための、水揚げ方法をまとめた一冊の辞典。</p>

    <div class="search-wrap">
      <span class="search-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/>
          <path d="m20 20-3.5-3.5"/>
        </svg>
      </span>
      <input id="search" class="search" type="search" placeholder="花の名前を入力 (例: バラ、ガーベラ、ヒマワリ…)" autocomplete="off" />
      <button class="search-clear" id="searchClear" type="button" aria-label="クリア">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="categories" id="categories"></div>
  </section>

  <main>
    <div class="grid" id="grid"></div>
  </main>

  <footer class="site">
    <div class="serif">花の手 — HANA NO TE</div>
    <div style="margin-top:8px;">A FIELD GUIDE FOR FLORISTS</div>
  </footer>

  <!-- MODAL -->
  <div class="modal-backdrop" id="modal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalName">
      <button class="modal-close" id="modalClose" aria-label="閉じる">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <div class="modal-hero">
        <div class="modal-cat" id="modalCat"></div>
        <div class="modal-name serif" id="modalName"></div>
        <div class="modal-latin" id="modalLatin"></div>
        <p class="modal-tagline" id="modalTagline"></p>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
    /* ─────────────────────────────────────
       水揚げデータ
       method: 主な水揚げ手法のタグ
       steps : 実際の手順
       info  : 一覧で要点を確認できるカード情報
       note  : 注意点・コツ
       ───────────────────────────────────── */
    const FLOWERS = [
      {
        name: 'バラ', kana: 'ばら', alias: ['ローズ', 'rose'],
        latin: 'Rosa',
        category: '定番',
        method: ['水中切り', '深水'],
        tagline: '茎が硬く水が上がりにくいため、水中切りと深水で一気に通水させるのが基本。',
        steps: [
          '下葉とトゲを取り除き、葉は2〜3枚に整える。',
          '深いバケツに水を張り、水の中で茎を斜めに2〜3cm切り戻す（水中切り）。',
          '茎の半分以上が水に浸かる深水に1〜2時間置き、しっかり吸わせる。',
          '元気がない時は新聞紙で首までしっかり巻き、深水でリフレッシュ。'
        ],
        info: { water: '深水', cut: '水中切り（斜め）', life: '5〜7日', season: '通年' },
        note: 'うつむいた首は<strong>新聞紙巻き＋深水</strong>で90％以上回復します。切り口がぬめったら必ず洗って切り直しを。'
      },
      {
        name: 'ガーベラ', kana: 'がーべら', alias: ['gerbera'],
        latin: 'Gerbera',
        category: '定番',
        method: ['湯揚げ', '浅水'],
        tagline: '茎が柔らかく腐りやすい。水は浅く、こまめに換える。',
        steps: [
          '葉は元々ないので、茎の汚れを軽く拭く。',
          '新聞紙で花首をまっすぐに巻く（首折れ防止）。',
          '湯揚げする場合は、切り口を熱湯に5〜10秒、その後すぐ深水へ。',
          '飾る際は<strong>水位3〜5cm</strong>の浅水で、毎日水替え＆切り戻し。'
        ],
        info: { water: '浅水（3〜5cm）', cut: '水切り or 湯揚げ', life: '5〜10日', season: '通年' },
        note: '茎が水に浸かりすぎると一気に腐ります。<strong>浅水＋毎日水替え</strong>が最大のコツ。'
      },
      {
        name: 'カーネーション', kana: 'かーねーしょん', alias: ['carnation'],
        latin: 'Dianthus caryophyllus',
        category: '定番',
        method: ['水切り', '節を避けて切る'],
        tagline: '節の部分は水を吸わない。必ず節と節の間で切ること。',
        steps: [
          '下葉を取り除く。',
          '茎の「節（ふくらんだ部分）」を避け、節と節の間で斜めに水切り。',
          '中深水で1時間ほど水揚げ。',
          '飾る際は中浅水で。エチレンに弱いため果物の近くは避ける。'
        ],
        info: { water: '中浅水', cut: '節を避け斜め切り', life: '7〜14日', season: '通年' },
        note: '日持ちは抜群。<strong>果物（特にりんご）から離す</strong>とさらに長持ちします。'

          '咲き終わった花を摘めば、つぼみが次々開く。',
          '涼しい場所で管理。'
        ],
        info: { water: '中浅水', cut: '水切り（斜め）', life: '14〜21日', season: '10〜12月' },
        note: '<strong>「ダイヤモンドリリー」</strong>の異名通り、光に当てると花弁がきらめきます。'
      },
      {
        name: 'コスモス', kana: 'こすもす', alias: ['cosmos'],
        latin: 'Cosmos',
        category: '秋',
        method: ['水切り', '浅水'],
        tagline: '茎が細く繊細。やさしく扱う。',
        steps: [
          '葉を軽く整える。',
          '茎を斜めに水切り。',
          '浅水で吸水。',
          'こまめに水を換える。'
        ],
        info: { water: '浅水', cut: '水切り（斜め）', life: '3〜5日', season: '8〜11月' },
        note: '<strong>短命花</strong>。涼しい場所での管理で1日でも長く。'
      }
    ];

    /* ─────── 状態 ─────── */
    const state = {
      query: '',
      category: 'すべて',
    };

    const grid = document.getElementById('grid');
    const searchEl = document.getElementById('search');
    const clearBtn = document.getElementById('searchClear');
    const categoriesEl = document.getElementById('categories');
    const totalCountEl = document.getElementById('totalCount');

    totalCountEl.textContent = FLOWERS.length;

    /* カテゴリ抽出 */
    const categories = ['すべて', ...Array.from(new Set(FLOWERS.map(f => f.category)))];

    function renderCategories() {
      categoriesEl.innerHTML = categories.map(c =>
        `<button class="chip ${c === state.category ? 'active' : ''}" data-cat="${c}">${c}</button>`
      ).join('');
      categoriesEl.querySelectorAll('.chip').forEach(btn => {
        btn.addEventListener('click', () => {
          state.category = btn.dataset.cat;
          renderCategories();
          renderGrid();
        });
      });
    }

    function highlight(text, q) {
      if (!q) return escapeHtml(text);
      const re = new RegExp(`(${escapeRegex(q)})`, 'ig');
      return escapeHtml(text).replace(re, '<mark>$1</mark>');
    }
    function escapeHtml(s) { return s.replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
    function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

    function matches(f, q) {
      if (!q) return true;
      const hay = [f.name, f.kana, f.latin, ...(f.alias || [])].join(' ').toLowerCase();
      return hay.includes(q.toLowerCase());
    }

    function renderGrid() {
      const q = state.query.trim();
      const list = FLOWERS.filter(f =>
        (state.category === 'すべて' || f.category === state.category) && matches(f, q)
      );

      if (list.length === 0) {
        grid.innerHTML = `
          <div class="empty">
            <div class="serif">該当する花が見つかりませんでした。</div>
            <div>別のキーワードでお試しください。</div>
          </div>`;
        return;
      }

      grid.innerHTML = list.map((f, idx) => `
        <button class="card" data-name="${f.name}" style="animation-delay:${Math.min(idx * 30, 300)}ms">
          <div class="card-head">
            <div>
              <div class="card-name">${highlight(f.name, q)}</div>
              <div class="card-latin">${highlight(f.latin, q)}</div>
            </div>
            <span class="card-cat">${f.category}</span>
          </div>
          <div class="card-method">
            ${f.method.map((m, i) => `<span class="tag ${i === 0 ? 'primary' : ''}">${m}</span>`).join('')}
          </div>
          <div class="card-snippet">${escapeHtml(f.tagline)}</div>
          <div class="card-foot">
            <span>${f.info.life}</span>
            <span class="more">水揚げを見る
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
            </span>
          </div>
        </button>
      `).join('');

      grid.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', () => openModal(card.dataset.name));
      });
    }

    /* ─────── モーダル ─────── */
    const modal = document.getElementById('modal');
    const modalClose = document.getElementById('modalClose');
    const modalCat = document.getElementById('modalCat');
    const modalName = document.getElementById('modalName');
    const modalLatin = document.getElementById('modalLatin');
    const modalTagline = document.getElementById('modalTagline');
    const modalBody = document.getElementById('modalBody');

    function openModal(name) {
      const f = FLOWERS.find(x => x.name === name);
      if (!f) return;
      modalCat.textContent = `${f.category}  —  ${f.method.join(' / ')}`;
      modalName.textContent = f.name;
      modalLatin.textContent = f.latin;
      modalTagline.textContent = f.tagline;
      modalBody.innerHTML = `
        <div class="section">
          <div class="section-label">水揚げの手順</div>
          <ol class="steps">${f.steps.map(s => `<li>${s}</li>`).join('')}</ol>
        </div>
        <div class="section">
          <div class="section-label">基本情報</div>
          <div class="info-grid">
            <div class="info-card"><div class="k">水の深さ</div><div class="v">${f.info.water}</div></div>
            <div class="info-card"><div class="k">切り方</div><div class="v">${f.info.cut}</div></div>
            <div class="info-card"><div class="k">花持ち</div><div class="v">${f.info.life}</div></div>
            <div class="info-card"><div class="k">時期</div><div class="v">${f.info.season}</div></div>
          </div>
        </div>
        <div class="section">
          <div class="section-label">プロのひと言</div>
          <div class="note">${f.note}</div>
        </div>
      `;
      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    modalClose.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

    /* ─────── 検索 ─────── */
    searchEl.addEventListener('input', (e) => {
      state.query = e.target.value;
      clearBtn.classList.toggle('visible', state.query.length > 0);
      renderGrid();
    });
    clearBtn.addEventListener('click', () => {
      searchEl.value = '';
      state.query = '';
      clearBtn.classList.remove('visible');
      searchEl.focus();
      renderGrid();
    });

    /* ─────── キーボードショートカット ─────── */
    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== searchEl) {
        e.preventDefault();
        searchEl.focus();
      }
    });

    /* 初期描画 */
    renderCategories();
    renderGrid();
  </script>
</body>
</html>
