<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>自分のページを編集 — Keifu Community</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .profile-wrap { display: grid; grid-template-columns: 320px 1fr; gap: 28px; align-items: start; }
    @media (max-width: 1180px){ .profile-wrap { grid-template-columns: 1fr; } }

    .pcol {
      background: var(--paper);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-card);
      padding: 32px 28px;
      text-align: center;
    }
    .pcol .portrait {
      width: 180px; height: 180px;
      border-radius: 50%;
      margin: 0 auto 18px;
      background: linear-gradient(135deg,#9a8260,#5c4830);
      border: 3px solid var(--gold);
      box-shadow: 0 8px 24px rgba(184,151,90,0.18);
      position: relative;
    }
    .pcol .portrait .edit {
      position: absolute; bottom: 6px; right: 6px;
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--navy);
      color: var(--gold);
      display: flex; align-items: center; justify-content: center;
      border: 3px solid var(--paper);
    }
    .pcol .ja-name { font-size: 26px; color: var(--navy); letter-spacing: 0.12em; }
    .pcol .romaji { font-family: var(--font-display); font-size: 13px; letter-spacing: 0.3em; color: var(--gold); text-transform: uppercase; margin-top: 8px; }
    .pcol .role-pill {
      display: inline-block;
      margin-top: 16px;
      padding: 6px 16px;
      border: 1px solid var(--gold);
      color: var(--gold);
      font-family: var(--font-display);
      font-size: 11px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      border-radius: 999px;
    }
    .pcol .quick {
      margin-top: 22px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      text-align: left;
      font-family: var(--font-sans);
      font-size: 13px;
      color: var(--text-mid);
      display: grid;
      gap: 12px;
    }
    .pcol .quick .row { display: flex; justify-content: space-between; }
    .pcol .quick .row .k {
      color: var(--text-light);
      letter-spacing: 0.1em;
      font-size: 11px;
      text-transform: uppercase;
      font-family: var(--font-display);
    }
    .pcol .quick .row .v { color: var(--navy); }

    .pmain {
      background: var(--paper);
      border-radius: var(--r-xl);
      box-shadow: var(--shadow-card);
      padding: 32px 36px;
    }

    .save-bar {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    .visibility {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .visibility label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-family: var(--font-sans);
      font-size: 12px;
      color: var(--text-mid);
      cursor: pointer;
      letter-spacing: 0.04em;
    }
    .visibility input { display: none; }
    .visibility input:checked + span {
      background: var(--gold);
      color: var(--navy);
      padding: 4px 12px;
      border-radius: 999px;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">Keifu<small>Community</small></div>
    <nav class="nav">
      <a href="index.html"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>ホーム</a>
      <a href="tree.html"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 4v6m-6 4v6m12-6v6M6 14h12M9 4h6"/></svg>家系図</a>
      <a href="memories.html"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M3 17l5-5 4 4 3-3 6 6"/></svg>アルバム・証言</a>
      <a href="profile.html" class="active"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 5-6 8-6s7 2 8 6"/></svg>自分のページ</a>
      <a href="notifications.html"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M6 8a6 6 0 0112 0v5l2 3H4l2-3V8zM10 19a2 2 0 004 0"/></svg>お知らせ</a>
      <a href="gifts.html"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 9h18v3H3zM5 12v9h14v-9M12 9V5"/></svg>ギフト・お供え</a>
      <a href="book.html"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 5a2 2 0 012-2h6v18H6a2 2 0 01-2-2V5zM12 3h6a2 2 0 012 2v14a2 2 0 01-2 2h-6"/></svg>印刷・ブック</a>
    </nav>
    <div class="me-card">
      <div class="avatar" style="background:linear-gradient(135deg,#9a8260,#5c4830)"></div>
      <div class="meta"><div class="name">山田 太郎</div><div class="role">マイページ</div></div>
    </div>
  </aside>


  <main class="main" style="grid-column: span 2;">
    <div class="page-head">
      <div class="crumbs">
        <a href="index.html">HOME</a><span class="sep">›</span>
        <span>MY PAGE</span>
      </div>
      <div style="display:flex; align-items:center; gap:28px; flex-wrap:wrap;">
        <div style="flex:1; min-width:280px;">
          <h1 class="page-title">
            <span class="accent"></span>
            自分のページを編集
          </h1>
          <p class="page-lead">
            あなた自身の人生を、自分の言葉で残してください。<br/>
            写真・経歴・想い…すべてご家族や子孫に受け継がれていきます。<strong style="color:var(--gold)">公開範囲</strong>は項目ごとに調整できます。
          </p>
        </div>
        <img src="img/animal-rabbit.svg" alt="" style="width:140px; height:140px; flex-shrink:0;" />
      </div>
    </div>

    <div class="profile-wrap">

      <!-- プロフィールサマリー -->
      <aside class="pcol">
        <div class="portrait">
          <span class="edit">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 20h9M4 20l4-1 11-11-3-3L5 16l-1 4z"/></svg>
          </span>
        </div>
        <div class="ja-name">山田 太郎</div>
        <div class="romaji">Taro Yamada</div>
        <div class="role-pill">家系図 管理者</div>

        <div class="quick">
          <div class="row"><span class="k">Born</span><span class="v">1972 / 東京</span></div>
          <div class="row"><span class="k">Lives</span><span class="v">神奈川県横浜市</span></div>
          <div class="row"><span class="k">Family</span><span class="v">妻・子2人</span></div>
          <div class="row"><span class="k">Joined</span><span class="v">2025年12月</span></div>
        </div>

        <div class="divider-deco">
          <div class="line"></div><div class="mark">links</div><div class="line"></div>
        </div>

        <button class="btn btn-ghost" style="width:100%;justify-content:center">
          <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-3-6.7M21 3v6h-6"/></svg>
          公開プロフィールを見る
        </button>
      </aside>


      <!-- 編集フォーム -->
      <section class="pmain">

        <div class="tabs">
          <a class="tab active">基本情報</a>
          <a class="tab">経歴・思い出</a>
          <a class="tab">家族との関係</a>
          <a class="tab">公開設定</a>
        </div>

        <div class="field-row">
          <div class="field">
            <label>姓</label>
            <input type="text" value="山田" />
          </div>
          <div class="field">
            <label>名</label>
            <input type="text" value="太郎" />
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label>ふりがな</label>
            <input type="text" value="やまだ たろう" />
          </div>
          <div class="field">
            <label>表示名</label>
            <input type="text" value="太郎" placeholder="家族間での呼ばれ方" />
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label>生年月日</label>
            <input type="text" value="1972年8月12日" />
          </div>
          <div class="field">
            <label>出身地</label>
            <input type="text" value="東京都世田谷区" />
          </div>
        </div>

        <div class="field">
          <label>現在お住まいの地域</label>
          <input type="text" value="神奈川県横浜市" />
        </div>

        <div class="field">
          <label>家族へのひとこと</label>
          <textarea placeholder="家族に知っておいてほしいこと、あなたらしいエピソードを自由に書いてください">家族の歴史を一冊にまとめたい、と長年思っていました。みんなで少しずつ書き足していけたら、何より嬉しいです。父・母から聞いた話、祖父母の写真、子どもたちが将来も覚えていてほしいことを、ここに残していきます。</textarea>
        </div>

        <div class="divider-deco">
          <div class="line"></div><div class="mark">people</div><div class="line"></div>
        </div>

        <div class="field-row">
          <div class="field">
            <label>父</label>
            <input type="text" value="山田 正明（1942 —）" />
          </div>
          <div class="field">
            <label>母</label>
            <input type="text" value="山田 久子（1944 —）" />
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label>配偶者</label>
            <input type="text" value="山田 麻衣（1975 —）" />
          </div>
          <div class="field">
            <label>子</label>
            <input type="text" value="山田 健一・山田 美咲" />
          </div>
        </div>

        <div class="field">
          <label>このページの公開範囲</label>
          <div class="visibility">
            <label><input type="radio" name="vis" checked/><span>家族のみ</span></label>
            <label><input type="radio" name="vis"/><span>招待した人のみ</span></label>
            <label><input type="radio" name="vis"/><span>非公開（自分のみ）</span></label>
          </div>
        </div>

        <div class="save-bar">
          <button class="btn btn-ghost">プレビュー</button>
          <button class="btn btn-primary">
            <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
            変更を保存する
          </button>
        </div>

      </section>
    </div>
  </main>
</div>

</body>
</html>
