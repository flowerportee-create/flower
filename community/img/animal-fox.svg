    <path d="M78 88 C90 92 104 100 116 116 C128 134 130 158 124 178 C118 192 100 196 80 192 C60 188 46 180 38 168 C32 154 32 134 40 116 C46 102 56 94 78 88" fill="#fefdfa"/>
