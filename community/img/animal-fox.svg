    <path d="M58 190 L56 196 M62 190 L62 196 M66 190 L66 196" stroke-width="0.9"/>
    <path d="M94 178 L92 192 L102 194 L104 180" fill="#fefdfa"/>
    <path d="M94 192 L92 198 M98 192 L98 198 M102 192 L102 198" stroke-width="0.9"/>
    <!-- 大きな尻尾 -->
    <path d="M120 124 C150 110 180 116 196 134 C210 152 208 174 192 184 C176 192 154 188 138 178 C128 170 122 158 120 144" fill="#fefdfa"/>
    <path d="M174 124 C188 130 196 140 198 152" stroke-width="0.8"/>
