    </g>
    <g transform="translate(166,140) rotate(-5)">
      <path d="M0 -18 L10 -14 L12 14 L-12 14 L-10 -14 Z" fill="#fefdfa" stroke-width="1.2"/>
      <text x="0" y="-2" text-anchor="middle" font-family="Noto Serif JP" font-size="7" fill="#1a2340" stroke="none">角行</text>
    </g>
    <g transform="translate(192,148) rotate(8)">
      <path d="M0 -18 L10 -14 L12 14 L-12 14 L-10 -14 Z" fill="#fefdfa" stroke-width="1.2"/>
      <text x="0" y="-2" text-anchor="middle" font-family="Noto Serif JP" font-size="7" fill="#1a2340" stroke="none">桂馬</text>
    </g>
    <!-- 草 -->
    <path d="M40 208 L42 204 L44 208 M110 208 L112 204 L114 208 M200 208 L202 204 L204 208" stroke-width="0.9"/>
