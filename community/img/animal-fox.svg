    <path d="M194 134 C204 142 208 152 206 162 C202 168 196 168 192 162 C188 156 188 142 194 134" fill="#1a2340"/>
    <!-- 将棋駒3つ -->
    <g transform="translate(140,148) rotate(-15)">
