<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 110" fill="none">
  <defs>
    <style>
      .lt { font-family: 'Cormorant Garamond', serif; font-weight: 400; font-style: italic; fill: #b8975a; }
    </style>
  </defs>
  <!-- Keifu wordmark with flourish -->
  <g>
    <!-- K -->
    <text class="lt" x="20" y="72" style="font-size: 80px; letter-spacing: -0.02em;">K</text>
    <!-- e -->
    <text class="lt" x="74" y="72" style="font-size: 72px; letter-spacing: -0.02em;">e</text>
    <!-- i -->
    <text class="lt" x="122" y="72" style="font-size: 72px; letter-spacing: -0.02em;">i</text>
    <!-- f -->
    <text class="lt" x="148" y="72" style="font-size: 80px; letter-spacing: -0.02em;">f</text>
    <!-- u -->
    <text class="lt" x="194" y="72" style="font-size: 72px; letter-spacing: -0.02em;">u</text>

    <!-- 装飾的なフローリッシュ：ロゴを横切る曲線 -->
    <path
      d="M 12 70
         C 30 76, 60 82, 90 70
         S 140 50, 180 64
         S 250 84, 282 64
         C 296 56, 304 60, 312 66"
      stroke="#b8975a"
      stroke-width="1.4"
      stroke-linecap="round"
      fill="none"
      opacity="0.95"/>

    <!-- 開始の小さな尻尾 -->
    <path d="M 8 68 C 4 64, 6 60, 12 62" stroke="#b8975a" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <!-- 終わりの尻尾 -->
    <path d="M 312 66 C 320 70, 326 78, 322 86 C 318 92, 312 88, 308 84" stroke="#b8975a" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  </g>
</svg>
